name: generate-builds
# REQUIRED STATUS CHECKS (#1373). The "basic" ruleset requires build-linux,
# build-windows and build-macos (and clang-format, from clang-format.yml). In
# this workflow each of those names belongs to ONE job, in the "Required status
# checks" section at the bottom of the file: a small job with `if: always()`
# that cannot be skipped and reports the outcome of the real build job
# (job ids build-linux / build-windows / build-macos, displayed as "Linux
# build" / "Windows build" / "macOS build"). It passes without a build only
# when the `docs-only` job below proved the pull request touches nothing but
# docs.
#
# This replaces docs-bypass.yml, whose stub jobs used the same names. On a PR
# that changed docs AND code the stubs finished `skipped`, and GitHub counts a
# job skipped by its `if` as a success for a required check. The real build-*
# check runs only appear once generate-rsbs-otr finishes, so for 20-60 s every
# required check read as satisfied, and #1321, #1325 and #1331 merged before
# any build had run. Never give another job, here or in any other workflow,
# one of the required names; tools/tests/test_required_checks.py fails if one
# does.
on:
  push:
    branches:
      - main
      # Creating a release/vX.Y.Z branch is an alternative release trigger for
      # credentials that can create branches but not tags or workflow
      # dispatches (e.g. the GitHub MCP integration used by remote agents).
      # create-release derives the tag from the branch name and deletes the
      # branch once the release exists.
      - 'release/v*'
    # Path filters are not evaluated for tag pushes, so paths-ignore below
    # only applies to branch pushes.
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  # No path filter on pull_request (#1373). A workflow skipped by a path filter
  # leaves its required checks "Expected" forever, so a docs-only PR could never
  # merge. Instead every PR runs this workflow, and the `docs-only` job decides
  # whether the heavy jobs run. Its patterns mirror the push paths-ignore list
  # above (.github/scripts/classify-docs-only.py; the python-tests lock keeps
  # the two equal).
  pull_request:
  # Manual release path: creates the tag (via `gh release create --target`) at
  # the dispatched commit and publishes the release from that run's builds.
  # Exists because not every agent/CI credential is allowed to push v* tags.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to cut, e.g. v0.4.4-alpha (must equal RSBS_VERSION_STRING)'
        required: true
        type: string
# CONCURRENCY (#1377). Only a pull request's run is ever cancelled in progress:
# a newer push to the PR makes the older head's build worthless. A push to
# main, to a release/v* branch or of a v* tag, and a dispatch, always run to
# the end. Main's run is the only one that saves the macOS ccache, the MacPorts
# tree and the Windows sccache, and a cold macOS build takes about 4.5 hours.
# With cancel-in-progress on every event, each merge cancelled the running main
# build, so those caches were never written and every macOS build started cold.
#
# The group names the event as well as the ref:
#   - pushes to main share one group, so they queue and main builds one pushed
#     commit at a time. GitHub keeps one PENDING run per group: a newer push
#     replaces a queued run that has not started yet (it shows as cancelled),
#     never the run in progress. Builds stay bounded to one main push run at a
#     time, which keeps macOS minutes and cache saves (see #177 under
#     build-windows) in check. A dispatch on main has a group of its own, so it
#     can run beside that push run.
#   - a dispatch (the manual release path) never shares a group with a push,
#     so a merge can never replace a queued release.
#   - each pull request, release branch and tag has a ref, and so a group, of
#     its own. Trigger each release once: a second push to the same release/v*
#     branch now queues behind the first instead of cancelling it, and its
#     create-release can find the release made and re-upload its own build over
#     the assets (the tag stays on the first commit). A tag push and a dispatch
#     on that tag ref are in different groups and can both reach create-release.
# tools/tests/test_required_checks.py evaluates these expressions for every
# workflow and fails if any run on main, a release branch or a tag could be
# cancelled in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:

  # Is this pull request provably docs-only? (#1373)
  #
  # Runs on EVERY event and has no `if`, so it is never skipped. That matters
  # because GitHub carries a skip down the whole `needs` chain: if this job were
  # skipped on a push or a tag, every build job and create-release below would
  # be skipped with it. On anything but a pull_request it answers
  # docs_only=false without checking anything out.
  #
  # On a pull_request it diffs the merge commit GitHub tests (refs/pull/N/merge)
  # against its first parent, the base branch tip. That is exactly what merging
  # would change, whatever the PR branch is based on. The classifier answers
  # true only for a non-empty change set made entirely of docs paths. A
  # surprise, such as a merge commit whose second parent is not the PR head,
  # answers false. If this job FAILS, generate-rsbs-otr is skipped (its
  # implicit success() is false), every build is skipped with it, and the
  # required-check jobs at the bottom go red: a failed check never reads as
  # docs-only.
  docs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - name: Git Checkout (the PR merge commit and its two parents)
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v4
      with:
        # Depth 2 fetches the merge commit and both of its parents. A sparse
        # checkout clones with --filter=blob:none, which is enough:
        # `git diff --name-only --no-renames` compares trees, never blobs.
        fetch-depth: 2
        sparse-checkout: .github/scripts
    - name: Classify the change set
      id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "${EVENT_NAME}" != "pull_request" ]; then
          echo "${EVENT_NAME} event: not a pull request, so the builds run."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        merged_head="$(git rev-parse --verify --quiet 'HEAD^2' || true)"
        if [ "${merged_head}" != "${PR_HEAD_SHA}" ]; then
          echo "::warning::HEAD^2 is '${merged_head}', not the PR head ${PR_HEAD_SHA}; treating the PR as code."
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Into a file first, so a failing git diff stops the step before the
        # classifier can answer from a partial list.
        git diff -z --name-only --no-renames 'HEAD^1' HEAD > "${RUNNER_TEMP}/changed-paths"
        python3 .github/scripts/classify-docs-only.py -z --github-output "$GITHUB_OUTPUT" < "${RUNNER_TEMP}/changed-paths"

  generate-rsbs-otr:
    # Skipped on a docs-only PR, and every job that needs it is skipped with
    # it. The required-check jobs at the bottom then pass without a build.
    needs: docs-only
    if: needs.docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    # Prebuilt CI image with cmake 3.26+, gcc-11, ccache, and SDL2/SDL2_net/
    # tinyxml2/libzip already compiled in (.github/docker/build-base.Dockerfile),
    # replacing the per-run apt install + deps-folder cache + from-source builds
    # that used to live in this job. static-analysis.yml uses the same image.
    container:
      image: ghcr.io/spencerduncan/redshipblueship-build:latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        # Tag push: check out the tag's commit by SHA. By default checkout
        # fetches `<sha>:refs/tags/<tag>` and fetch-tags fetches that ref again;
        # for an ANNOTATED tag the two differ and git refuses (#1059). fetch-tags
        # stays: CMakeLists.txt bakes `git describe --tags --exact-match HEAD`
        # into the build. Empty ref on other events keeps the default.
        ref: ${{ startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        fetch-depth: 1
        fetch-tags: true
    # Required for the git commands run by the otr-cache-key action and the
    # build: inside the container the workspace is owned by a different uid.
    - name: Configure git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Compute port-archive cache key
      id: otr-key
      uses: ./.github/actions/otr-cache-key
    # Exact-match only (no restore-keys): this caches final artifacts, not an
    # incremental cache — a stale partial restore would be silently wrong.
    - name: Restore port-archive Cache
      id: rsbs-otr-cache
      uses: actions/cache@v4
      with:
        key: ${{ steps.otr-key.outputs.key }}
        path: |
          soh.o2r
          2ship.o2r
    - name: Checkout submodules
      if: steps.rsbs-otr-cache.outputs.cache-hit != 'true'
      run: git submodule update --init --recursive
    - name: Configure ccache
      if: steps.rsbs-otr-cache.outputs.cache-hit != 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # Saved on main only, like every other build cache (see build-linux's
        # ccache step for why). A pull request restores main's entry.
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache-refs/heads/main
          ${{ runner.os }}-otr-ccache
    - name: Generate soh.o2r and 2ship.o2r
      if: steps.rsbs-otr-cache.outputs.cache-hit != 'true'
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target GenerateSohOtr Generate2ShipOtr -j10
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v4
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3
    - name: Upload 2ship.o2r
      uses: actions/upload-artifact@v4
      with:
        name: 2ship.o2r
        path: 2ship.o2r
        retention-days: 3

  build-macos:
    # Not "build-macos": that required check is reported by the required-
    # build-macos job at the bottom of this file (#1373).
    name: macOS build
    needs: generate-rsbs-otr
    # Pinned, not macos-latest: the MacPorts installer is built per macOS
    # release (macos-latest moved to macOS 26 and the Sonoma package refused to
    # install), and macos-14's compiler rejected soh_ui_snapshot.cpp (a lambda
    # capturing a structured binding) where macos-15's Xcode 16.4 compiles the
    # whole tree. MACOS_MAJOR below must name the same release: it picks the
    # MacPorts installer, keys both caches (so a MacPorts tree or ccache built
    # on one macOS is never restored on another), and sets the deployment
    # target; the first step fails the job when the two disagree.
    runs-on: macos-15
    env:
      MACOS_MAJOR: '15'
      # Proven on macos-15 by run 41302059266.
      MACPORTS_VERSION: '2.11.5'
    steps:
    - name: Check runner macOS matches MACOS_MAJOR
      run: |
        actual="$(sw_vers -productVersion)"
        echo "runner macOS ${actual}, MACOS_MAJOR ${MACOS_MAJOR}"
        if [ "${actual%%.*}" != "${MACOS_MAJOR}" ]; then
          echo "::error::runs-on gave macOS ${actual} but MACOS_MAJOR is ${MACOS_MAJOR}; change them together"
          exit 1
        fi
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        # Tag push by SHA, see the first checkout (#1059).
        ref: ${{ startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        fetch-depth: 1
        fetch-tags: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        # Saved on main only, like the Windows sccache (#177). Main's run is
        # never cancelled (#1377, the concurrency block at the top), so it
        # writes this cache, and a pull request restores it through the
        # refs/heads/main restore-key below. A per-PR save would add quota
        # churn that can evict main's entries for a gain that shrinks once
        # main is warm; revisit with the ccache numbers of a finished macOS run.
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-ccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-ccache-${{ github.ref }}
          ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-ccache-refs/heads/main
          ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-ccache
    # Needed to apply sudo for macports cache restore
    - name: Install gtar wrapper
      run: |
        sudo mv /opt/homebrew/bin/gtar /opt/homebrew/bin/gtar.orig
        sudo cp .github/workflows/gtar /opt/homebrew/bin/gtar
        sudo chmod +x /opt/homebrew/bin/gtar
    - name: Restore Cached MacPorts
      id: restore-cache-macports
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-macports-${{ env.MACPORTS_VERSION }}-${{ hashFiles('.github/workflows/macports-deps.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-macports-${{ env.MACPORTS_VERSION }}-
        path: /opt/local/
    # Updated PATH applies to the next step and onwards
    - name: Install MacPorts (if necessary)
      run: |
        if command -v /opt/local/bin/port >/dev/null 2>&1; then
          echo "MacPorts already installed"
        else
          # MacPorts names each installer after the macOS release it targets
          # (https://github.com/macports/macports-base/releases).
          case "${MACOS_MAJOR}" in
            14) codename=Sonoma ;;
            15) codename=Sequoia ;;
            26) codename=Tahoe ;;
            *) echo "::error::no MacPorts installer name known for macOS ${MACOS_MAJOR}"; exit 1 ;;
          esac
          pkg="MacPorts-${MACPORTS_VERSION}-${MACOS_MAJOR}-${codename}.pkg"
          echo "Installing ${pkg}"
          wget "https://github.com/macports/macports-base/releases/download/v${MACPORTS_VERSION}/${pkg}"
          sudo installer -pkg "./${pkg}" -target /
        fi
        echo "/opt/local/bin:/opt/local/sbin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        brew uninstall --ignore-dependencies libpng
        sudo port install $(cat .github/workflows/macports-deps.txt)
        brew install ninja
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v4
      with:
        name: 2ship.o2r
        path: build-cmake/mm
    # Deployment target: the MacPorts libraries target the macOS they were
    # built on (ports built here from source, and the buildbot archives this
    # job fetches for the same release), so they carry minos MACOS_MAJOR.0.
    # Linking them at CMakeLists.txt's default 10.15 warned "built for newer
    # 'macOS' version (15.0) than being linked (10.15)" and the app would still
    # need macOS 15 to start, so the job links at MACOS_MAJOR.0 and the bundle
    # declares it (LSMinimumSystemVersion). Lowering macports.conf's
    # macosx_deployment_target instead would have to cover the prebuilt archives
    # this job fetches as well as the ports it builds, so older macOS support is
    # a later decision, not a flag.
    - name: Build redship
      run: |
        export PATH="/usr/lib/ccache:/opt/homebrew/opt/ccache/libexec:/usr/local/opt/ccache/libexec:$PATH"
        export PKG_CONFIG_PATH="/opt/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        echo "MacPorts libSDL2 build version:"
        vtool -show-build /opt/local/lib/libSDL2.dylib || true
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_MAJOR}.0" -DCMAKE_PREFIX_PATH=/opt/local -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release --parallel 10
        if ! (cd build-cmake && cpack); then
          # The install rules and fixup_bundle log here, not to the console.
          find build-cmake/_CPack_Packages -name 'InstallOutput.log' -exec sh -c 'echo "== $1"; tail -n 300 "$1"' _ {} \;
          exit 1
        fi

        mv _packages/*.dmg RedShipBlueShip.dmg
        mv README.md readme.txt
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: rsbs-mac
        path: |
          RedShipBlueShip.dmg
          readme.txt
    - name: Save Cache MacPorts
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-${{ env.MACOS_MAJOR }}-${{ runner.arch }}-macports-${{ env.MACPORTS_VERSION }}-${{ hashFiles('.github/workflows/macports-deps.txt') }}
        path: /opt/local/

  odr-declaration-gate:
    # Source-level twin of the nm-based gates in build-linux below. The #375
    # symbol-collision gate intersects symbols DEFINED by the compiled
    # archives, so it is structurally blind to the excluded-side ODR class
    # (#468): a type declared in both game trees with identical mangled names
    # and divergent layouts, where one side's implementation TU is excluded
    # from the single-exe link — the excluded side defines no symbols, the
    # intersection stays empty, and CI reports OK. This gate compares
    # DECLARATIONS across games/oot/soh and games/mm/2s2h instead (duplicated
    # include guards + same-named types in overlapping namespaces) against
    # .github/odr-declaration-baseline.txt, whose entries were classified in
    # the #468 audit (the GameInteractor hook family is tracked as latent in
    # #470). Build-free, so it runs as its own fast job instead of inside the
    # Linux build.
    runs-on: ubuntu-latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Self-test ODR declaration gate
      # Regression guard on the step below, mirroring the --self-test steps
      # for the nm gates: plants a divergent duplicate in fixture trees and
      # asserts the scan flags it, passes the namespace-S2H fix shape, and
      # refuses to pass on vacuous input.
      run: python3 .github/scripts/check-odr-declaration-collisions.py --self-test
    - name: Check cross-tree ODR declaration collisions (#468)
      run: python3 .github/scripts/check-odr-declaration-collisions.py

  build-linux:
    # Not "build-linux": that required check is reported by the required-
    # build-linux job at the bottom of this file (#1373).
    name: Linux build
    needs: generate-rsbs-otr
    runs-on: ubuntu-22.04
    # Prebuilt CI image (see generate-rsbs-otr above) — replaces the per-run
    # apt install + deps-folder cache + SDL/SDL_net/tinyxml2/libzip source
    # builds that used to live in this job.
    container:
      image: ghcr.io/spencerduncan/redshipblueship-build:latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        # Tag push by SHA, see the first checkout (#1059).
        ref: ${{ startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        fetch-depth: 1
        fetch-tags: true
    - name: Configure git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    # Tools the appimage packaging needs that GitHub's hosted runners ship but
    # the container does not yet:
    #  - imagemagick: consumed at CMake configure time (find_package(ImageMagick))
    #    to produce build-cmake/sohIcon.png; without it configure silently skips
    #    the icon and linuxdeploy fails with "No such file: sohIcon.png".
    #  - file, desktop-file-utils: hard requirements of appimagetool — its
    #    dependency check die()s on missing `file` and `desktop-file-validate`
    #    (verified against the binary's check strings; zsyncmake/appstreamcli/
    #    gpg are warnings only and mksquashfs is bundled in the plugin).
    # Drop this step once the image (build-base.Dockerfile) has been
    # republished with these baked in. xvfb + llvmpipe are for the RandoGen
    # seed-generation test, which needs a display but no game archives.
    - name: Install packaging tools
      run: |
        apt-get update
        apt-get install -y imagemagick file desktop-file-utils xvfb libgl1-mesa-dri
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # Saved on main only (operator, 2026-11-05). A pull request restores
        # main's newest entry (restore-keys below) and recompiles only the files
        # it touches, on every push. Saving on every branch (2026-06 to
        # 2026-11) made each PR write ~700 MB, and with a dozen open PRs the
        # repository's 10 GB Actions cache cap evicted, least recently used
        # first, the caches only main writes: the macOS ccache (a cold macOS
        # build is ~4.5 hours), the MacPorts tree and the Windows sccache.
        # Main-only saving keeps those alive between releases.
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        # The action's default 500M cap is too small for the full OoT+MM build
        # (~8180 objects): measured 2026-06-11 at 89.66% full with 15 cleanups
        # and a 73.24% hit rate. The working set is ~1.0-1.2G compressed.
        max-size: "1.5G"
        key: ${{ runner.os }}-ccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache-refs/heads/main
          ${{ runner.os }}-ccache
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v4
      with:
        name: 2ship.o2r
        path: build-cmake/mm
    # Stage the port archives where the ctest tiers actually look (#560).
    # The downloads above land them where the INSTALL rules read them
    # (${CMAKE_BINARY_DIR}/soh, .../mm). Test rows resolve archives through
    # Ship::Context::LocateFileAcrossAppDirs, which probes the app-config dir,
    # then the running binary's OWN directory, then "./" — and for a row started
    # by `ctest --test-dir build-cmake` all three of those are build-cmake, never
    # build-cmake/soh. So every row in the redship and rando tiers has been
    # booting with ZERO archives mounted. The rando log says so out loud:
    #   "The archive at path .../build-cmake/./soh.o2r does not exist"
    #
    # Not cosmetic. libultraship PAUSES the ResourceManager thread pool forever
    # when no archive is loaded (ResourceManager.cpp:58-61, "Nothing ever
    # unpauses the thread pool"), so any synchronous resource load in that state
    # deadlocks on .get(). That is the real, undocumented reason the rando rows
    # need RSBS_DISABLE_OTR_INIT=1: OTRAudio_Init performs exactly such a load.
    #
    # A copy, not a move, so Package still finds its originals. netplay-relay is
    # deliberately left archive-less: it re-runs the redship tier, so it keeps an
    # archive-less control over the same rows.
    - name: Stage port archives for the ctest tiers (#560)
      run: |
        cp build-cmake/soh/soh.o2r build-cmake/soh.o2r
        cp build-cmake/mm/2ship.o2r build-cmake/2ship.o2r
        ls -l build-cmake/soh.o2r build-cmake/2ship.o2r
    - name: Build SoH
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j10
      env:
        CC: gcc-11
        CXX: g++-11
        # Key the cache on the compiler's content hash instead of the default
        # mtime+size, so caches survive container image rebuilds (which reset
        # mtimes and otherwise force a full ~20 min recompile).
        CCACHE_COMPILERCHECK: content
    - name: Verify linker map (Linux) (#1303)
      run: |
        test -s build-cmake/redship.map || { echo "FAIL: build-cmake/redship.map is missing or empty"; exit 1; }
        grep -q "Context_GetCurrentGame" build-cmake/redship.map || { echo "FAIL: Context_GetCurrentGame not found in build-cmake/redship.map"; exit 1; }
        ls -lh build-cmake/redship.map
    - name: Self-test registrar elision gate
      # Regression guard on the step below: synthesizes tiny archive/object
      # files with gcc/ar/ld -r (no real soh/2ship content involved) and
      # asserts the occurrence-count attribution logic still (a) passes a
      # plain no-collision present case, (b) FAILS when a required archive's
      # own registrar member is dropped from the link, (c) reports a
      # basename-colliding report-only archive PRESENT when its own member is
      # genuinely also linked, and (d) reports it MISSING when only the
      # required archive's same-named member survived — the measurement
      # artifact fixed by this gate (docs/unified-surface-findings.md §4:
      # _GLOBAL__sub_I_<file> is keyed on basename only, so 11 MM enhancement
      # TUs with identically-named OoT twins were invisible to elision).
      # Mirrors the check-exporter-symbol-collisions.sh --self-test added in
      # #430 for the same "guard the guard" reason.
      run: bash .github/scripts/check-registrar-elision.sh --self-test
    - name: Check registrar elision (#341)
      # Self-registering TUs (RegisterShipInitFunc static initializers) must
      # survive the archive link — plain archive semantics silently drop them
      # (the PR #340 song-shuffle failure class). nm-based, Linux-only.
      run: bash .github/scripts/check-registrar-elision.sh build-cmake
    - name: Check cross-game symbol collisions
      # Symbols defined by BOTH soh_* and 2ship_* archives resolve first-wins
      # in the single-exe link, silently running one game's code against the
      # other's data (the #367 / FrameInterpolation / AudioCollection failure
      # class). Fails on any intersection growth beyond the committed
      # baseline. nm-based, Linux-only.
      run: bash .github/scripts/check-symbol-collisions.sh build-cmake
    - name: Self-test exporter symbol-collision gate (#411)
      # Regression guard on the step below: synthesizes tiny archive pairs
      # with gcc/ar (no OTRExporter submodule involved) and asserts the
      # strong-DATA-symbol detection logic still flags a shared global,
      # still passes a pair with none, and still refuses to pass vacuously
      # on a DATA-symbol-free archive. Protects the gate itself from silent
      # breakage going unnoticed as "nothing to report".
      run: bash .github/scripts/check-exporter-symbol-collisions.sh --self-test
    - name: Check OTRExporter_OoT/OTRExporter_MM data-symbol collisions (#411)
      # OTRExporter_OoT and OTRExporter_MM compile identical sources and are
      # both deliberately linked into redship for in-app ROM extraction
      # (CMake/SingleExecutable.cmake:141-153). Windows /FORCE:MULTIPLE folds
      # any symbol defined by both into one storage slot but runs BOTH
      # variants' dynamic initializers and atexit destructors against it —
      # the Fault A double-construction/double-destruction class (#396,
      # fixed for the original 11 globals in #413). No baseline: after #413
      # the strong-DATA-symbol intersection is empty and any regrowth fails
      # the build. The ~20 duplicated strong FUNCTION symbols are out of
      # scope by design (see #411) — they fold harmlessly because redship
      # never executes them (extraction spawns single-variant ZAPD_OoT/
      # ZAPD_MM subprocesses instead, issue #325).
      run: bash .github/scripts/check-exporter-symbol-collisions.sh build-cmake
    - name: Run tests
      # --no-tests=error: if the "redship" test label ever regresses, fail loudly
      # instead of ctest exiting 0 with "No tests were found".
      run: ctest --test-dir build-cmake --output-on-failure --label-regex "^redship$" --no-tests=error
    - name: Run rando seed generation test
      env:
        # Name each ShipInit func as it runs so a hang/crash inside one is
        # attributable from the log alone (see ShipInit.hpp; added for #361).
        RSBS_TRACE_SHIP_INIT: "1"
      # Generates a real seed with default settings (issue #337). Needs a
      # display for the Fast3dWindow bring-up (hence xvfb-run) but NO game
      # archives, so unlike the int-* tier it can run on hosted runners.
      run: xvfb-run -a ctest --test-dir build-cmake --output-on-failure --label-regex "^rando$" --no-tests=error
    - name: Print this build's golden determinism digests (#688)
      # ALWAYS, and after the tier rather than instead of it. `--output-on-failure`
      # shows a golden row's digest only when the row FAILS, which makes "do
      # Windows and Linux generate the same world for the same seed?" answerable
      # exactly when the answer is already bad news. These are the files the
      # golden rows compared, so the Linux world is in every log, pass or fail —
      # and tests/golden/ holds the Windows-generated bytes the row checked them
      # against (docs/determinism-goldens.md).
      if: always()
      run: |
        for f in build-cmake/golden-*-actual.txt; do
          [ -e "$f" ] || { echo "no golden digest artifacts were produced"; break; }
          echo "===== $f ====="
          cat "$f"
        done
    # The digests this leg PRODUCED, for digest-crossos-diff (#1003): the golden
    # rows' actual files, the self-diff rows' first runs, and the hint and shop
    # digests the redship tier writes. A few KB.
    - name: Upload this build's determinism digests (Linux) (#1003)
      if: always()
      run: |
        mkdir -p crossos-digests
        for f in build-cmake/golden-*-actual.txt build-cmake/seed-determinism-run1.txt \
                 build-cmake/paired-attempt-run1.txt build-cmake/rsbs_*_digest.txt; do
          [ -e "$f" ] && cp "$f" crossos-digests/
        done
        ls -la crossos-digests
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: determinism-digests-linux
        path: crossos-digests/
        if-no-files-found: warn
        retention-days: 7
    # The seed package this leg's SeedPackageRoundTrip row wrote, with the report of
    # the world a second Linux process loaded from it, for package-crossos-load
    # (#1044): a package made here must load on Windows to the same world.
    - name: Upload this build's seed package (Linux) (#1044)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seed-package-linux
        path: |
          build-cmake/seed-package-roundtrip.rsbs-seed.zip
          build-cmake/seed-package-roundtrip-load.txt
        if-no-files-found: warn
        retention-days: 7
    # The UI snapshot harness (docs/ui-style-guide.md section 12): SoH's own menu
    # pages and every page this project added, rendered the same way into
    # build-cmake/ui-snapshots/ for an agent or reviewer to compare. Its OWN label
    # and its OWN step, so the rando step above (and the golden rows in it) keep
    # xvfb-run's default screen: this one needs a 24-bit visual, which the row
    # itself asserts (colour bits >= 8). ROM-free here, so it draws the probe menu
    # (the Combo section, the Randomizer pointer page, Dev Tools) and records the
    # ROM-only reference pages as skipped. Structure-only asserts; it never
    # compares pixels against a stored image. SHIP_HOME points at a fresh
    # directory, which moves the Context's app directory there (Linux): the
    # harness must write its pinned config where the Context reads it, or the
    # window comes up at the default size and the drawable-size assert fails.
    # The Windows twin runs without it, so both resolutions stay exercised.
    - name: Run UI snapshot harness (ui label)
      run: |
        export SHIP_HOME="$(mktemp -d)"
        xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build-cmake --output-on-failure --label-regex "^ui$" --no-tests=error
        ls -la "$SHIP_HOME"
    - name: Upload UI snapshots (Linux)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-snapshots-linux
        path: build-cmake/ui-snapshots/
        if-no-files-found: warn
        retention-days: 14
    - name: Package
      run: |
        (cd build-cmake && cpack -G External)
        mv README.md readme.txt
        mv build-cmake/*.appimage rsbs.appimage
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: rsbs-linux
        path: |
          rsbs.appimage
          readme.txt
    - name: Upload linker map (Linux) (#1303)
      uses: actions/upload-artifact@v4
      with:
        name: redship-map-linux
        path: build-cmake/redship.map
        if-no-files-found: error

  # ==========================================================================
  # Netplay grant relay (ADR 0007, #460)
  #
  # A SEPARATE job rather than a flag on build-linux, deliberately: build-linux
  # packages and uploads the released appimage, so enabling the relay there
  # would SHIP a feature that is supposed to be off by default. Default-off has
  # to mean shipped-off, which means the relay never enters a release artifact.
  #
  # This job does two things build-linux cannot:
  #   1. builds with RSBS_NETPLAY=ON and runs the Relay* locks, which do not
  #      exist in a default configure;
  #   2. asserts the DEFAULT configure pulls in no netplay translation unit —
  #      the verifiable form of "the default build is unaffected".
  # It uploads nothing.
  # ==========================================================================
  netplay-relay:
    needs: generate-rsbs-otr
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/spencerduncan/redshipblueship-build:latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        # Tag push by SHA, see the first checkout (#1059).
        ref: ${{ startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        fetch-depth: 1
        fetch-tags: true
    - name: Configure git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install packaging tools
      run: |
        apt-get update
        apt-get install -y imagemagick file desktop-file-utils
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # Saved on main only, like build-linux's ccache (see the reason there);
        # a pull request restores main's netplay entry first.
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        max-size: "1.5G"
        key: ${{ runner.os }}-ccache-netplay-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-ccache-netplay-${{ github.ref }}
          ${{ runner.os }}-ccache-netplay-refs/heads/main
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache-refs/heads/main
          ${{ runner.os }}-ccache
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v4
      with:
        name: 2ship.o2r
        path: build-cmake/mm
    - name: Assert the DEFAULT build pulls in no netplay TU
      # Configure-only (seconds, no compile) in the default configuration and
      # grep the generated build system. With RSBS_NETPLAY=OFF the netplay
      # sources are never appended to REDSHIP_COMMON_SOURCES, so no rule
      # referencing them can exist. This is the negative control for the
      # positive one below; without it "default OFF" is a claim about CMake
      # that nothing checks.
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-default -GNinja -DCMAKE_BUILD_TYPE:STRING=Release >/dev/null
        if grep -rq "netplay/relay_" build-default/build.ninja; then
          echo "FAIL: default configure references a netplay source; RSBS_NETPLAY=OFF must mean absent."
          grep -rn "netplay/relay_" build-default/build.ninja | head
          exit 1
        fi
        echo "OK: default configure pulls in no netplay translation unit."
      env:
        CC: gcc-11
        CXX: g++-11
    - name: Build with RSBS_NETPLAY=ON
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1 -DRSBS_NETPLAY=1
        cmake --build build-cmake --config Release -j10
      env:
        CC: gcc-11
        CXX: g++-11
        CCACHE_COMPILERCHECK: content
    - name: Assert the relay actually linked
      # Positive control. If the flag silently stopped adding the sources, the
      # Relay* rows below would vanish and ctest's --no-tests=error would be
      # the only thing standing between us and a vacuous green.
      run: |
        if ! nm -C build-cmake/redship | grep -q "Relay_Tick"; then
          echo "FAIL: RSBS_NETPLAY=ON but Relay_Tick is not in the binary."
          exit 1
        fi
        echo "OK: relay symbols linked."
    - name: Run netplay relay locks
      # ROM-free and display-free: the loopback ledger is in-process. See the
      # header of src/common/tests/test_netplay_relay.c for what these prove
      # and — equally load-bearing — what they do not.
      run: ctest --test-dir build-cmake --output-on-failure --tests-regex "^Relay" --no-tests=error
    - name: Run the full ROM-free tier with the relay built
      # The relay must not perturb anything else. Same label the default
      # build-linux job runs, so a regression here is attributable to the flag.
      run: ctest --test-dir build-cmake --output-on-failure --label-regex "^redship$" --no-tests=error

  build-windows:
    # Issue #177 — investigation results (2026-06-01, runs 26731031162 / 26731511201 / 26731832242):
    #   * sccache hit rate: 99.82% (2848 hits / 2853 executed / 5 misses) — the cache works.
    #   * CMake configure: 73-114s (vcpkg bootstrap + install, mostly binary-cache hits).
    #   * CMake build: ~474s wall-clock with 2860 ninja steps → ~165ms per step.
    #     With 99.8% cache hits, those 165ms are NOT compilation — they are sccache+cl.exe
    #     process spawn overhead per cache lookup on a 4-vCPU windows-latest runner.
    #   * vcpkg folder cache hits; x-gha vcpkg binary cache hits; lld-link engaged.
    # Conclusion: every safe lever (sccache, vcpkg binary cache, vcpkg folder cache, lld-link,
    # split steps for diagnostics) is already pulled. Further wins would require either
    # CMAKE_UNITY_BUILD (high blast radius across game CMakeLists), moving off MSVC,
    # or a larger runner. None fit a low-risk CI tuning change. The Linux/Windows gap is
    # the fundamental Windows MSVC + ninja per-step process-spawn cost, not a config bug.
    # Update 2026-06-11: the warm-cache conclusion above still holds; the later
    # degradation to ~26 min builds (65.89% hit rate) was 10GB cache-quota LRU
    # eviction caused by per-PR ~2.3GB sccache saves — fixed by the main-only
    # save policy on the "Configure sccache" step below.
    #
    # Not "build-windows": that required check is reported by the required-
    # build-windows job at the bottom of this file (#1373).
    name: Windows build
    needs: generate-rsbs-otr
    runs-on: windows-latest
    env:
      # vcpkg binary caching via GitHub Actions cache. vcpkg stores prebuilt port
      # binaries keyed by their ABI hash, so unchanged deps skip source compilation.
      # Requires ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN, exported below.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
    - name: Export GitHub Actions cache env vars for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        choco install ninja llvm -y --no-progress
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        # Tag push by SHA, see the first checkout (#1059).
        ref: ${{ startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
        fetch-depth: 1
        fetch-tags: true
    - name: Configure sccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        max-size: "5G"
        # Save on main only. The previous per-branch save policy (issue #177)
        # wrote a fresh ~2.3GB cache on every PR push; at the current PR rate
        # that blew the repo's 10GB Actions-cache quota and LRU-evicted main's
        # linux-ccache/deps/vcpkg/soh.o2r caches (measured 2026-06-11: 65.89%
        # sccache hit rate and ~26 min builds, vs 99.82% and ~8 min on
        # 2026-06-01). Main merges several times a day, so the main-keyed
        # cache restored via restore-keys is nearly fresh for every PR; a PR's
        # repeated pushes only re-compile files the PR itself touched.
        #
        # Deliberately NOT changed when build-linux's ccache moved to
        # save-on-every-branch: this step is the one with direct measured
        # evidence of blowing the quota, its per-run save is ~2.3GB (vs 1.5G
        # capped on Linux), and Windows already runs at a 99.8% hit rate off
        # main's cache, so there is little left for a branch-scoped cache to
        # win. Revisit only with fresh hit-rate numbers.
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-sccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-sccache-${{ github.ref }}
          ${{ runner.os }}-sccache-refs/heads/main
          ${{ runner.os }}-sccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-v2-
          ${{ runner.os }}-vcpkg-v1-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: bw/soh
    - name: Download 2ship.o2r
      uses: actions/download-artifact@v4
      with:
        name: 2ship.o2r
        path: bw/mm
    # Stage the port archives where the ctest tier actually looks (#560, #623).
    # Same mechanism as build-linux's step of this name: the downloads above
    # land where the INSTALL rules read them (bw/soh, bw/mm), but a row
    # started by `ctest --test-dir bw` resolves archives through
    # Ship::Context::LocateFileAcrossAppDirs, which probes the app-config
    # dir, then the running binary's OWN directory, then "./". On Windows
    # SHIP_HOME is not honored, so the app-config dir is "." = the row's cwd
    # (bw/); the exe is bw/redship.exe (RUNTIME_OUTPUT_DIRECTORY under the
    # single-config Ninja generator); and "./" is bw/ again. None of the three
    # is bw/soh, so without this copy ZipContention / CuratedArchiveOrder /
    # ModArchiveSurvivesSwitch self-skip (exit 77) and the tier silently loses
    # its archive-mounted rows. A copy, not a move: Package still installs
    # from bw/soh/soh.o2r and bw/mm/2ship.o2r.
    - name: Stage port archives for the ctest tier (#560)
      run: |
        Copy-Item bw/soh/soh.o2r bw/soh.o2r
        Copy-Item bw/mm/2ship.o2r bw/2ship.o2r
        Get-ChildItem bw/soh.o2r, bw/2ship.o2r
    # Build is split into Configure / Build / Package so the GitHub Actions UI
    # surfaces per-stage timing. Issue #177 — previously a single ~24 min step,
    # making it impossible to tell whether time was going to vcpkg, compile, link
    # or cpack. Keep these as separate steps even after tuning is done; the cost
    # is negligible (~1s of step overhead) and the diagnostic value is permanent.
    - name: CMake configure (Windows)
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B bw -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1 -DUSE_LLD_LINKER=ON
    # Zero sccache stats before the build so the post-build "show-stats" reflects
    # ONLY this run's cache deltas (without it, hendrikmuhs/ccache-action reports
    # lifetime stats including the previous run that warmed the cache, which can
    # mislead diagnosis of issue #177-style questions about *this* run's hit rate).
    - name: Zero sccache stats
      run: sccache --zero-stats
    - name: CMake build (Windows)
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: cmake --build bw --config Release --parallel 10
    - name: sccache stats (Windows)
      if: always()
      run: sccache --show-stats
    - name: Verify linker map (Windows) (#1303)
      run: |
        if (-not (Test-Path -LiteralPath 'bw/redship.map')) {
          throw 'FAIL: bw/redship.map does not exist'
        }
        if (-not (Select-String -LiteralPath 'bw/redship.map' -SimpleMatch -Quiet 'Context_GetCurrentGame')) {
          throw 'FAIL: Context_GetCurrentGame not found in bw/redship.map'
        }
        Get-Item -LiteralPath 'bw/redship.map'
    # Run the display-free `redship` tier against the Windows binary (#623).
    # Until this step the job compiled both games and every test row and ran
    # none of them, so MSVC codegen, /FORCE:MULTIPLE first-wins link semantics
    # and Windows CRT behavior had no automated coverage — the operator's
    # local ctest runs were the de facto Windows gate. The tier needs no
    # display, no ROM and no GPU (rows that need extracted archives or
    # the curated redship-*.o2r self-skip with exit 77, exactly as on Linux).
    #
    # ctest is resolved next to the cmake.exe the configure step already
    # used (same install, same version) rather than trusting a second PATH
    # lookup. --no-tests=error mirrors build-linux: if the label ever
    # regresses, fail loudly instead of exiting 0 with "No tests were found".
    - name: Run tests (Windows)
      run: |
        $ctest = Join-Path (Split-Path -Parent (Get-Command cmake).Source) 'ctest.exe'
        & $ctest --version
        & $ctest --test-dir bw --output-on-failure --label-regex '^redship$' --no-tests=error
    # THE WHOLE `rando` TIER, ON MSVC (#709; the golden rows of #688 are in it).
    # This job used to assert that the rando tier could not run here: every rando row
    # brings up a Fast3dWindow (xvfb-run on Linux), and a hosted windows-latest
    # runner's OpenGL was assumed to be too old for that. Measured, not assumed:
    # first the three Golden* rows (3/3 in 5.4 s, run 35648094332, job 106493621321,
    # which is why this step used to be `--tests-regex '^Golden'`), then the whole
    # label on PR #723 — 28/28 passed on two attempts of run 36226677282
    # (jobs 108362021770 and 108370383924), in 46.1 s and 68.0 s of ctest time (the
    # second runner was slower across the board: the redship tier took 29.0 s and
    # 44.0 s), against 38.1 s for the same 28 rows on the Linux leg. The step grew
    # from 7-10 s (Golden only, the three main runs of 2026-09-22) to 46-69 s, so
    # the tier costs this job about a minute. No row self-skipped and none failed.
    #
    # Selected by LABEL now, which also retires a trap: a golden row used to be
    # enforced on this leg only if its name started with `Golden`. Any row carrying
    # `LABEL rando` runs on both legs. Not continue-on-error: a tier that cannot fail
    # is the vacuity #688 was filed about.
    #
    # Consequence worth keeping in view: this leg and the Linux leg check the SAME
    # committed golden bytes, so "MSVC and GCC generate the same world for the same
    # seed" is a property CI re-verifies on every PR rather than a measurement
    # somebody took once (docs/determinism-goldens.md, "Platform portability").
    - name: Run rando tier (Windows/MSVC) (#709, #688)
      env:
        # Same as build-linux's rando step: name each ShipInit func as it runs so a
        # hang/crash inside one is attributable from the log alone (#361).
        RSBS_TRACE_SHIP_INIT: "1"
      run: |
        $ctest = Join-Path (Split-Path -Parent (Get-Command cmake).Source) 'ctest.exe'
        & $ctest --test-dir bw --output-on-failure --label-regex '^rando$' --no-tests=error
    # The Windows twin of build-linux's "Print this build's golden determinism
    # digests" step, and it exists for the reason that step states: with only
    # `--output-on-failure`, a PASSING row's digest never reaches the log, so "do
    # Windows and Linux generate the same world for the same seed?" was answerable
    # from the logs exactly when the answer was already bad news. For one PR the
    # dump existed on the Linux leg only while docs/determinism-goldens.md claimed
    # both legs had it — measured on the merged tip: run 35650187916, Windows job
    # 106500643608 carried zero digest lines, Linux job 106500643765 carried all
    # three in full. `if: always()`, and after the rows rather than instead of
    # them: the artifacts are what the rows compared, so this leg's world is in
    # every log, pass or fail.
    - name: Print this build's golden determinism digests (Windows) (#688)
      if: always()
      run: |
        $files = @(Get-ChildItem -Path bw -Filter 'golden-*-actual.txt' -File -ErrorAction SilentlyContinue)
        if ($files.Count -eq 0) {
          Write-Host 'no golden digest artifacts were produced'
        } else {
          foreach ($f in $files) {
            Write-Host "===== $($f.Name) ====="
            Get-Content -LiteralPath $f.FullName
          }
        }
    # The Windows twin of build-linux's digest upload, for digest-crossos-diff (#1003).
    - name: Upload this build's determinism digests (Windows) (#1003)
      if: always()
      run: |
        New-Item -ItemType Directory -Force crossos-digests | Out-Null
        foreach ($pattern in @('golden-*-actual.txt', 'seed-determinism-run1.txt', 'paired-attempt-run1.txt', 'rsbs_*_digest.txt')) {
          Get-ChildItem -Path bw -Filter $pattern -File -ErrorAction SilentlyContinue | Copy-Item -Destination crossos-digests
        }
        Get-ChildItem crossos-digests
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: determinism-digests-windows
        path: crossos-digests/
        if-no-files-found: warn
        retention-days: 7
    # The Windows twin of build-linux's UI snapshot step. The harness picks the
    # DirectX 11 backend here (auto: DX11 when CI is set on Windows; a hosted
    # runner has no usable desktop GL) and reads back through the swap chain, and
    # picks the largest profile that fits the runner's desktop, recorded in the
    # manifest. Never compare these images with the Linux ones.
    - name: Run UI snapshot harness (Windows) (ui label)
      run: |
        $ctest = Join-Path (Split-Path -Parent (Get-Command cmake).Source) 'ctest.exe'
        & $ctest --test-dir bw --output-on-failure --label-regex '^ui$' --no-tests=error
    - name: Upload UI snapshots (Windows)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-snapshots-windows
        path: bw/ui-snapshots/
        if-no-files-found: warn
        retention-days: 14
    - name: Package (Windows)
      run: |
        cd bw
        cpack
        cd ..
        mv _packages/*.zip _packages/rsbs-windows.zip
    - name: Unzip package
      run: |
        Expand-Archive -Path _packages/rsbs-windows.zip -DestinationPath rsbs-windows
        if (Test-Path -LiteralPath 'rsbs-windows/redship.map') {
          throw 'FAIL: redship.map must not ship inside the player zip (_packages/rsbs-windows.zip)'
        }
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: rsbs-windows
        path: rsbs-windows
    - name: Upload linker map (Windows) (#1303)
      uses: actions/upload-artifact@v4
      with:
        name: redship-map-windows
        path: bw/redship.map
        if-no-files-found: error
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}
        path: vcpkg

  # ==========================================================================
  # Cross-OS digest diff (#1003)
  #
  # Both legs compare their golden rows against the SAME committed bytes, which
  # proves they agree only on what a committed golden pins. This job diffs the
  # digests the two legs PRODUCED against each other (field by field, CR
  # stripped): the self-diff rows' worlds and the hint and shop digests no
  # golden pins, and a world a PR moves on purpose, where both legs are red
  # against the old golden and only this says whether they agree on the new
  # one. It fails when any file differs or exists on one leg only.
  #
  # Cheap (a sparse checkout of one script and two small artifacts) and NOT a
  # required check. Skipped when a leg never ran, as on a docs-only PR, whose
  # build legs the docs-only job skips; runs when a leg is red, because the
  # diff still says whether the two OSes agree.
  # ==========================================================================
  digest-crossos-diff:
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() && needs.build-linux.result != 'skipped' && needs.build-windows.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/scripts
        fetch-depth: 1
    - name: Download the Linux leg's digests
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: determinism-digests-linux
        path: digests/linux
    - name: Download the Windows leg's digests
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: determinism-digests-windows
        path: digests/windows
    - name: Diff the two legs' digests
      run: python3 .github/scripts/diff-crossos-digests.py digests/linux linux digests/windows windows

  # ==========================================================================
  # Cross-OS seed package load (#1044)
  #
  # A seed package carries a finished paired world, so a package made on one OS
  # must load on the other to the same world. The Linux leg's SeedPackageRoundTrip
  # row writes a package and reports the world a second Linux process loaded from
  # it; this job loads that same package with the Windows build's own
  # `--test seed-package-load` and requires the two reports equal, field by field
  # (identity and records, OoT's placement and content, the crossings, the give
  # capabilities, MM's half byte for byte with its world and content, the
  # spoiler's bytes). Not a required check, like digest-crossos-diff.
  # ==========================================================================
  package-crossos-load:
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/scripts
        fetch-depth: 1
    - name: Download the Windows build
      uses: actions/download-artifact@v4
      with:
        name: rsbs-windows
        path: rsbs-windows
    - name: Download the Linux leg's seed package
      uses: actions/download-artifact@v4
      with:
        name: seed-package-linux
        path: linux-package
    - name: Load the Linux package with the Windows build
      shell: pwsh
      env:
        SDL_AUDIODRIVER: dummy
        SDL_WINDOW_NO_ACTIVATION_WHEN_SHOWN: "1"
        RSBS_DISABLE_OTR_INIT: "1"
      run: |
        $package = Join-Path $PWD 'linux-package/seed-package-roundtrip.rsbs-seed.zip'
        if (-not (Test-Path $package)) { throw "the Linux leg uploaded no seed package" }
        New-Item -ItemType Directory -Force reports/linux, reports/windows | Out-Null
        Copy-Item linux-package/seed-package-roundtrip-load.txt reports/linux/seed-package-load.txt
        $exe = Get-ChildItem -Path rsbs-windows -Recurse -Filter redship.exe | Select-Object -First 1
        if ($null -eq $exe) { throw "the Windows build artifact holds no redship.exe" }
        $env:RSBS_SEED_PACKAGE_PATH = $package
        $env:RSBS_SEED_PACKAGE_REPORT = Join-Path $PWD 'reports/windows/seed-package-load.txt'
        Push-Location $exe.DirectoryName
        & $exe.FullName --test seed-package-load
        $rc = $LASTEXITCODE
        Pop-Location
        if ($rc -ne 0) { throw "redship --test seed-package-load exited $rc on the Linux package" }
    - name: Diff the Linux and Windows loads of the Linux package
      run: python .github/scripts/diff-crossos-digests.py reports/linux linux reports/windows windows

  create-release:
    # Tag-triggered release publishing (issue #318): attaches the builds from
    # the jobs above to a GitHub Release so testers get a stable
    # download URL that outlives the short CI artifact retention window.
    # Also runs on workflow_dispatch, where it creates the tag itself at the
    # dispatched commit (see the trigger comment at the top of this file).
    # macOS is intentionally absent: build-macos packages a bundle, but nobody
    # has run it on a Mac yet, so releases do not carry it.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    # Tag name precedence: dispatch input, else the ref name with any
    # release/ branch prefix stripped (a no-op for tag-push refs).
    - name: Resolve release tag
      env:
        INPUT_TAG: ${{ inputs.release_tag }}
      run: |
        TAG="${INPUT_TAG:-${GITHUB_REF_NAME#release/}}"
        echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
    # The tag rule (src/common/rsbs_version.h): a release tag must equal
    # RSBS_VERSION_STRING, "v<MAJOR>.<MINOR>.<PATCH>-<STAGE>". Otherwise the
    # release would ship a build whose window title and --version name another
    # version, so refuse it before anything is published.
    # tools/tests/test_repo_invariants.py runs this step's script against the
    # header (test_release_tag_check_exports_the_codename).
    - name: Check release tag equals RSBS_VERSION_STRING
      run: |
        HDR=src/common/rsbs_version.h
        field() { sed -n "s/^#define RSBS_VERSION_$1[[:space:]]\{1,\}//p" "$HDR" | tr -d '"\r' | sed 's/[[:space:]]*$//'; }
        MAJOR="$(field MAJOR)"; MINOR="$(field MINOR)"; PATCH="$(field PATCH)"; STAGE="$(field STAGE)"
        CODENAME="$(field CODENAME)"
        if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ] || [ -z "$STAGE" ] || [ -z "$CODENAME" ]; then
          echo "::error::could not read RSBS_VERSION_MAJOR/MINOR/PATCH/STAGE/CODENAME from ${HDR}"
          exit 1
        fi
        EXPECTED="v${MAJOR}.${MINOR}.${PATCH}-${STAGE}"
        if [ "${RELEASE_TAG}" != "${EXPECTED}" ]; then
          echo "::error::release tag '${RELEASE_TAG}' does not equal RSBS_VERSION_STRING '${EXPECTED}' (${HDR})"
          exit 1
        fi
        echo "Release tag ${RELEASE_TAG} equals RSBS_VERSION_STRING (${CODENAME})."
        # The release title names the codename the header carries, as the
        # window title does: "RedShipBlueShip v0.4.4-alpha (Deckard Echo)".
        echo "RSBS_VERSION_CODENAME=${CODENAME}" >> "$GITHUB_ENV"
    - name: Download Linux build
      uses: actions/download-artifact@v4
      with:
        name: rsbs-linux
        path: rsbs-linux
    - name: Download Linux linker map (#1303)
      uses: actions/download-artifact@v4
      with:
        name: redship-map-linux
        path: redship-map-linux
    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: rsbs-windows
        path: rsbs-windows
    - name: Download Windows linker map (#1303)
      uses: actions/download-artifact@v4
      with:
        name: redship-map-windows
        path: redship-map-windows
    - name: Prepare release assets
      run: |
        mv rsbs-linux/rsbs.appimage "redshipblueship-${RELEASE_TAG}-linux.AppImage"
        mv redship-map-linux/redship.map "redshipblueship-${RELEASE_TAG}-linux.map"
        # build-windows uploads the unzipped cpack output (artifacts are stored
        # extracted so PR testers get a browsable tree); re-zip it for release.
        (cd rsbs-windows && zip -qr "../redshipblueship-${RELEASE_TAG}-windows.zip" .)
        mv redship-map-windows/redship.map "redshipblueship-${RELEASE_TAG}-windows.map"
    # The notes name the seed generator version a package must match, read from
    # RSBS_GENERATOR_VERSION (src/common/foreign_items.h) so it never goes
    # stale. tools/tests/test_repo_invariants.py runs this step's script
    # (test_release_notes_render_fills_the_generator_version).
    - name: Render release notes
      run: |
        GEN="$(sed -n 's/^#define RSBS_GENERATOR_VERSION[[:space:]]\{1,\}\([0-9]\{1,\}\)[uU]\{0,1\}\([[:space:]].*\)\{0,1\}$/\1/p' src/common/foreign_items.h | tr -d '\r')"
        if [ -z "${GEN}" ]; then
          echo "::error::could not read RSBS_GENERATOR_VERSION from src/common/foreign_items.h"
          exit 1
        fi
        sed -e "s/{{TAG}}/${RELEASE_TAG}/g" -e "s/{{GENERATOR_VERSION}}/${GEN}/g" .github/release-notes-template.md > release-notes.md
        if grep -n '{{' release-notes.md; then
          echo "::error::release-notes.md still has a {{...}} placeholder"
          exit 1
        fi
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ASSETS=(
          "redshipblueship-${RELEASE_TAG}-linux.AppImage"
          "redshipblueship-${RELEASE_TAG}-linux.map"
          "redshipblueship-${RELEASE_TAG}-windows.zip"
          "redshipblueship-${RELEASE_TAG}-windows.map"
        )
        # Idempotent on re-runs: if the release already exists, refresh its assets.
        if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
          gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
        else
          # --target creates the tag at this run's commit when the tag doesn't
          # exist yet (workflow_dispatch); it is ignored for existing tags.
          gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "RedShipBlueShip ${RELEASE_TAG} (${RSBS_VERSION_CODENAME})" \
            --notes-file release-notes.md \
            --prerelease
        fi
    # The branch was only a trigger vehicle; the tag now records the release
    # commit, so drop the branch to keep the ref namespace tidy.
    - name: Delete release trigger branch
      if: startsWith(github.ref, 'refs/heads/release/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/${GITHUB_REF}"

  monotonicity-probe:
    # ADR 0010 answer O6's STATIC PROBE (#645, #500). The combo fill is sound
    # only while reachability is monotone in items (ADR 0010 section 2.3), and
    # O6 enforces that three ways at once: the review rule
    # (.claude/worker-prompts.md, docs/monotonicity.md), the rando-tier CI
    # grow-check (ComboLogicMonotonicity), and this scan. It reads both graphs'
    # condition sources — OoT's location_access region files, MM's
    # Logic/Regions files and Logic.h — for negations and downward comparisons
    # over PLAYER-STATE terms (a negated settings/trick term is legal), and
    # fails on any hit not in .github/monotonicity-negation-baseline.txt, whose
    # every entry carries a reading and is printed on every run. Build-free, so
    # it runs as its own fast job, like odr-declaration-gate.
    runs-on: ubuntu-latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Self-test the monotonicity probe
      # Regression guard on the step below: plants sixteen violations in
      # fixture trees and asserts each is classified and fails the gate, that
      # comments and strings are ignored, that the legal shapes pass, that a
      # baselined site passes only with a reading, that a stale entry fails,
      # and that vacuous input is refused.
      run: python3 .github/scripts/check-monotonicity-negations.py --self-test
    - name: Scan both logic graphs for player-state negations (ADR 0010 O6)
      run: python3 .github/scripts/check-monotonicity-negations.py

  # ==========================================================================
  # Required status checks (#1373)
  #
  # The "basic" ruleset requires the check names build-linux, build-windows and
  # build-macos. Each one is produced by exactly one job in exactly one
  # workflow: the job below. It reports the outcome of the real build job of
  # the same id, which is displayed as "Linux build", "Windows build" or
  # "macOS build" so that its own check run can never satisfy the requirement.
  #
  # `if: always()` is the point of these jobs. GitHub reports a job skipped by
  # its `if`, or by a failed or skipped `needs`, as a success for a required
  # check ("Use always() with needs for required checks that depend on other
  # jobs", docs: troubleshooting required status checks). A job that always
  # runs cannot be skipped, so it can only report what really happened:
  #   - the build job succeeded                                 -> pass
  #   - a pull_request the docs-only job PROVED docs-only
  #     (job succeeded, docs_only=true), so the build skipped   -> pass, no build
  #   - anything else: the build failed, was cancelled, or was
  #     skipped because generate-rsbs-otr or docs-only failed   -> FAIL
  # Until the real job finishes this job has no check run, so the required check
  # reads "Expected" and the PR cannot merge. That closes the window #1331 merged
  # through.
  #
  # The three jobs run the same script; only BUILD_JOB, BUILD_JOB_NAME and
  # BUILD_RESULT differ. tools/tests/test_required_checks.py runs the script
  # against every combination of results and locks the shape of these jobs.
  # ==========================================================================
  required-build-linux:
    name: build-linux
    needs: [docs-only, build-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Report the Linux build's outcome
      env:
        EVENT_NAME: ${{ github.event_name }}
        DOCS_ONLY_RESULT: ${{ needs.docs-only.result }}
        DOCS_ONLY: ${{ needs.docs-only.outputs.docs_only }}
        BUILD_JOB: build-linux
        BUILD_JOB_NAME: Linux build
        BUILD_RESULT: ${{ needs.build-linux.result }}
      run: |
        echo "${BUILD_JOB_NAME} (job ${BUILD_JOB}): '${BUILD_RESULT}'."
        echo "docs-only job: '${DOCS_ONLY_RESULT}', docs_only='${DOCS_ONLY}'. Event: ${EVENT_NAME}."
        if [ "${BUILD_RESULT}" = "success" ]; then
          exit 0
        fi
        if [ "${EVENT_NAME}" = "pull_request" ] && [ "${DOCS_ONLY_RESULT}" = "success" ] \
          && [ "${DOCS_ONLY}" = "true" ] && [ "${BUILD_RESULT}" = "skipped" ]; then
          echo "Docs-only pull request: nothing to build."
          exit 0
        fi
        echo "::error::${BUILD_JOB_NAME} (job ${BUILD_JOB}) concluded '${BUILD_RESULT}' and this is not a proven docs-only pull request. See that job's log."
        exit 1

  required-build-windows:
    name: build-windows
    needs: [docs-only, build-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Report the Windows build's outcome
      env:
        EVENT_NAME: ${{ github.event_name }}
        DOCS_ONLY_RESULT: ${{ needs.docs-only.result }}
        DOCS_ONLY: ${{ needs.docs-only.outputs.docs_only }}
        BUILD_JOB: build-windows
        BUILD_JOB_NAME: Windows build
        BUILD_RESULT: ${{ needs.build-windows.result }}
      run: |
        echo "${BUILD_JOB_NAME} (job ${BUILD_JOB}): '${BUILD_RESULT}'."
        echo "docs-only job: '${DOCS_ONLY_RESULT}', docs_only='${DOCS_ONLY}'. Event: ${EVENT_NAME}."
        if [ "${BUILD_RESULT}" = "success" ]; then
          exit 0
        fi
        if [ "${EVENT_NAME}" = "pull_request" ] && [ "${DOCS_ONLY_RESULT}" = "success" ] \
          && [ "${DOCS_ONLY}" = "true" ] && [ "${BUILD_RESULT}" = "skipped" ]; then
          echo "Docs-only pull request: nothing to build."
          exit 0
        fi
        echo "::error::${BUILD_JOB_NAME} (job ${BUILD_JOB}) concluded '${BUILD_RESULT}' and this is not a proven docs-only pull request. See that job's log."
        exit 1

  required-build-macos:
    name: build-macos
    needs: [docs-only, build-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Report the macOS build's outcome
      env:
        EVENT_NAME: ${{ github.event_name }}
        DOCS_ONLY_RESULT: ${{ needs.docs-only.result }}
        DOCS_ONLY: ${{ needs.docs-only.outputs.docs_only }}
        BUILD_JOB: build-macos
        BUILD_JOB_NAME: macOS build
        BUILD_RESULT: ${{ needs.build-macos.result }}
      run: |
        echo "${BUILD_JOB_NAME} (job ${BUILD_JOB}): '${BUILD_RESULT}'."
        echo "docs-only job: '${DOCS_ONLY_RESULT}', docs_only='${DOCS_ONLY}'. Event: ${EVENT_NAME}."
        if [ "${BUILD_RESULT}" = "success" ]; then
          exit 0
        fi
        if [ "${EVENT_NAME}" = "pull_request" ] && [ "${DOCS_ONLY_RESULT}" = "success" ] \
          && [ "${DOCS_ONLY}" = "true" ] && [ "${BUILD_RESULT}" = "skipped" ]; then
          echo "Docs-only pull request: nothing to build."
          exit 0
        fi
        echo "::error::${BUILD_JOB_NAME} (job ${BUILD_JOB}) concluded '${BUILD_RESULT}' and this is not a proven docs-only pull request. See that job's log."
        exit 1
