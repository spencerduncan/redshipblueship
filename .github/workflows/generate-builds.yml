name: generate-builds
on:
  push:
    branches:
      - main
      # Creating a release/vX.Y.Z branch is an alternative release trigger for
      # credentials that can create branches but not tags or workflow
      # dispatches (e.g. the GitHub MCP integration used by remote agents).
      # create-release derives the tag from the branch name and deletes the
      # branch once the release exists.
      - 'release/v*'
    # Path filters are not evaluated for tag pushes, so paths-ignore below
    # only applies to branch pushes.
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  # Manual release path: creates the tag (via `gh release create --target`) at
  # the dispatched commit and publishes the release from that run's builds.
  # Exists because not every agent/CI credential is allowed to push v* tags.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to cut, e.g. v0.1.0-prealpha (must equal RSBS_VERSION_STRING)'
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  generate-rsbs-otr:
    runs-on: ubuntu-22.04
    # Prebuilt CI image with cmake 3.26+, gcc-11, ccache, and SDL2/SDL2_net/
    # tinyxml2/libzip already compiled in (.github/docker/build-base.Dockerfile),
    # replacing the per-run apt install + deps-folder cache + from-source builds
    # that used to live in this job. static-analysis.yml uses the same image.
    container:
      image: ghcr.io/spencerduncan/redshipblueship-build:latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        fetch-tags: true
    # Required for the git commands run by the otr-cache-key action and the
    # build: inside the container the workspace is owned by a different uid.
    - name: Configure git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Compute soh.o2r cache key
      id: otr-key
      uses: ./.github/actions/otr-cache-key
    # Exact-match only (no restore-keys): this caches a final artifact, not an
    # incremental cache — a stale partial restore would be silently wrong.
    - name: Restore soh.o2r Cache
      id: rsbs-otr-cache
      uses: actions/cache@v4
      with:
        key: ${{ steps.otr-key.outputs.key }}
        path: soh.o2r
    - name: Checkout submodules
      if: steps.rsbs-otr-cache.outputs.cache-hit != 'true'
      run: git submodule update --init --recursive
    - name: Configure ccache
      if: steps.rsbs-otr-cache.outputs.cache-hit != 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache-refs/heads/main
          ${{ runner.os }}-otr-ccache
    - name: Generate soh.o2r
      if: steps.rsbs-otr-cache.outputs.cache-hit != 'true'
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DREDSHIP_BUILD_SHARED=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j10
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v4
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-macos:
    # DISABLED: macOS build is currently broken - see GitHub issue for tracking
    # Error: OoT shared library not linking against libultraship properly
    # Re-enable once issue is resolved
    if: false
    needs: generate-rsbs-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1
        fetch-tags: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-14-ccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-14-ccache-${{ github.ref }}
          ${{ runner.os }}-14-ccache-refs/heads/main
          ${{ runner.os }}-14-ccache
    # Needed to apply sudo for macports cache restore
    - name: Install gtar wrapper
      run: |
        sudo mv /opt/homebrew/bin/gtar /opt/homebrew/bin/gtar.orig
        sudo cp .github/workflows/gtar /opt/homebrew/bin/gtar
        sudo chmod +x /opt/homebrew/bin/gtar
    - name: Restore Cached MacPorts
      id: restore-cache-macports
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-14-macports-v1-${{ hashFiles('.github/workflows/macports-deps.txt') }}
        restore-keys: |
          ${{ runner.os }}-14-macports-v1-
        path: /opt/local/
    # Updated PATH applies to the next step and onwards
    - name: Install MacPorts (if necessary)
      run: |
        if command -v /opt/local/bin/port 2>&1 >/dev/null; then
          echo "MacPorts already installed"
        else
          echo "Installing MacPorts"
          wget https://github.com/macports/macports-base/releases/download/v2.11.5/MacPorts-2.11.5-14-Sonoma.pkg
          sudo installer -pkg ./MacPorts-2.11.5-14-Sonoma.pkg -target /
        fi
        echo "/opt/local/bin:/opt/local/sbin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        brew uninstall --ignore-dependencies libpng
        sudo port install $(cat .github/workflows/macports-deps.txt)
        brew install ninja
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        export PATH="/usr/lib/ccache:/opt/homebrew/opt/ccache/libexec:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1 -DREDSHIP_BUILD_SHARED=ON
        cmake --build build-cmake --config Release --parallel 10
        (cd build-cmake && cpack)

        mv _packages/*.dmg SoH.dmg
        mv README.md readme.txt
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: rsbs-mac
        path: |
          SoH.dmg
          readme.txt
    - name: Save Cache MacPorts
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-14-macports-v1-${{ hashFiles('.github/workflows/macports-deps.txt') }}
        path: /opt/local/

  build-linux:
    needs: generate-rsbs-otr
    runs-on: ubuntu-22.04
    # Prebuilt CI image (see generate-rsbs-otr above) — replaces the per-run
    # apt install + deps-folder cache + SDL/SDL_net/tinyxml2/libzip source
    # builds that used to live in this job.
    container:
      image: ghcr.io/spencerduncan/redshipblueship-build:latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1
        fetch-tags: true
    - name: Configure git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    # Tools the appimage packaging needs that GitHub's hosted runners ship but
    # the container does not yet:
    #  - imagemagick: consumed at CMake configure time (find_package(ImageMagick))
    #    to produce build-cmake/sohIcon.png; without it configure silently skips
    #    the icon and linuxdeploy fails with "No such file: sohIcon.png".
    #  - file, desktop-file-utils: hard requirements of appimagetool — its
    #    dependency check die()s on missing `file` and `desktop-file-validate`
    #    (verified against the binary's check strings; zsyncmake/appstreamcli/
    #    gpg are warnings only and mksquashfs is bundled in the plugin).
    # Drop this step once the image (build-base.Dockerfile) has been
    # republished with these baked in.
    - name: Install packaging tools
      run: |
        apt-get update
        apt-get install -y imagemagick file desktop-file-utils
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        # The action's default 500M cap is too small for the full OoT+MM build
        # (~8180 objects): measured 2026-06-11 at 89.66% full with 15 cleanups
        # and a 73.24% hit rate. The working set is ~1.0-1.2G compressed.
        max-size: "1.5G"
        key: ${{ runner.os }}-ccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache-refs/heads/main
          ${{ runner.os }}-ccache
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1 -DREDSHIP_BUILD_SHARED=ON
        cmake --build build-cmake --config Release -j10
      env:
        CC: gcc-11
        CXX: g++-11
        # Key the cache on the compiler's content hash instead of the default
        # mtime+size, so caches survive container image rebuilds (which reset
        # mtimes and otherwise force a full ~20 min recompile).
        CCACHE_COMPILERCHECK: content
    - name: Run tests
      # --no-tests=error: if the "redship" test label ever regresses, fail loudly
      # instead of ctest exiting 0 with "No tests were found".
      run: ctest --test-dir build-cmake --output-on-failure --label-regex "^redship$" --no-tests=error
    - name: Package
      run: |
        (cd build-cmake && cpack -G External)
        mv README.md readme.txt
        mv build-cmake/*.appimage rsbs.appimage
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: rsbs-linux
        path: |
          rsbs.appimage
          readme.txt

  build-windows:
    # Issue #177 — investigation results (2026-06-01, runs 26731031162 / 26731511201 / 26731832242):
    #   * sccache hit rate: 99.82% (2848 hits / 2853 executed / 5 misses) — the cache works.
    #   * CMake configure: 73-114s (vcpkg bootstrap + install, mostly binary-cache hits).
    #   * CMake build: ~474s wall-clock with 2860 ninja steps → ~165ms per step.
    #     With 99.8% cache hits, those 165ms are NOT compilation — they are sccache+cl.exe
    #     process spawn overhead per cache lookup on a 4-vCPU windows-latest runner.
    #   * vcpkg folder cache hits; x-gha vcpkg binary cache hits; lld-link engaged.
    # Conclusion: every safe lever (sccache, vcpkg binary cache, vcpkg folder cache, lld-link,
    # split steps for diagnostics) is already pulled. Further wins would require either
    # CMAKE_UNITY_BUILD (high blast radius across game CMakeLists), moving off MSVC,
    # or a larger runner. None fit a low-risk CI tuning change. The Linux/Windows gap is
    # the fundamental Windows MSVC + ninja per-step process-spawn cost, not a config bug.
    # Update 2026-06-11: the warm-cache conclusion above still holds; the later
    # degradation to ~26 min builds (65.89% hit rate) was 10GB cache-quota LRU
    # eviction caused by per-PR ~2.3GB sccache saves — fixed by the main-only
    # save policy on the "Configure sccache" step below.
    needs: generate-rsbs-otr
    runs-on: windows-latest
    env:
      # vcpkg binary caching via GitHub Actions cache. vcpkg stores prebuilt port
      # binaries keyed by their ABI hash, so unchanged deps skip source compilation.
      # Requires ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN, exported below.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
    - name: Export GitHub Actions cache env vars for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        choco install ninja llvm -y --no-progress
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1
        fetch-tags: true
    - name: Configure sccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        max-size: "5G"
        # Save on main only. The previous per-branch save policy (issue #177)
        # wrote a fresh ~2.3GB cache on every PR push; at the current PR rate
        # that blew the repo's 10GB Actions-cache quota and LRU-evicted main's
        # linux-ccache/deps/vcpkg/soh.o2r caches (measured 2026-06-11: 65.89%
        # sccache hit rate and ~26 min builds, vs 99.82% and ~8 min on
        # 2026-06-01). Main merges several times a day, so the main-keyed
        # cache restored via restore-keys is nearly fresh for every PR; a PR's
        # repeated pushes only re-compile files the PR itself touched.
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-sccache-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-sccache-${{ github.ref }}
          ${{ runner.os }}-sccache-refs/heads/main
          ${{ runner.os }}-sccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-v2-
          ${{ runner.os }}-vcpkg-v1-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download soh.o2r
      uses: actions/download-artifact@v4
      with:
        name: soh.o2r
        path: bw/soh
    # Build is split into Configure / Build / Package so the GitHub Actions UI
    # surfaces per-stage timing. Issue #177 — previously a single ~24 min step,
    # making it impossible to tell whether time was going to vcpkg, compile, link
    # or cpack. Keep these as separate steps even after tuning is done; the cost
    # is negligible (~1s of step overhead) and the diagnostic value is permanent.
    - name: CMake configure (Windows)
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B bw -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1 -DREDSHIP_BUILD_SHARED=ON -DUSE_LLD_LINKER=ON
    # Zero sccache stats before the build so the post-build "show-stats" reflects
    # ONLY this run's cache deltas (without it, hendrikmuhs/ccache-action reports
    # lifetime stats including the previous run that warmed the cache, which can
    # mislead diagnosis of issue #177-style questions about *this* run's hit rate).
    - name: Zero sccache stats
      run: sccache --zero-stats
    - name: CMake build (Windows)
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: cmake --build bw --config Release --parallel 10
    - name: sccache stats (Windows)
      if: always()
      run: sccache --show-stats
    - name: Package (Windows)
      run: |
        cd bw
        cpack
        cd ..
        mv _packages/*.zip _packages/rsbs-windows.zip
    - name: Unzip package
      run: Expand-Archive -Path _packages/rsbs-windows.zip -DestinationPath rsbs-windows
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: rsbs-windows
        path: rsbs-windows
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v4
      with:
        key: ${{ runner.os }}-vcpkg-v2-${{ hashFiles('CMakeLists.txt', 'CMake/automate-vcpkg.cmake') }}
        path: vcpkg

  create-release:
    # Tag-triggered release publishing (issue #318): attaches the builds from
    # the jobs above to a GitHub Release so pre-alpha testers get a stable
    # download URL that outlives the short CI artifact retention window.
    # Also runs on workflow_dispatch, where it creates the tag itself at the
    # dispatched commit (see the trigger comment at the top of this file).
    # macOS is intentionally absent — its CI build is disabled (see build-macos).
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    # Tag name precedence: dispatch input, else the ref name with any
    # release/ branch prefix stripped (a no-op for tag-push refs).
    - name: Resolve release tag
      env:
        INPUT_TAG: ${{ inputs.release_tag }}
      run: |
        TAG="${INPUT_TAG:-${GITHUB_REF_NAME#release/}}"
        echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
    - name: Download Linux build
      uses: actions/download-artifact@v4
      with:
        name: rsbs-linux
        path: rsbs-linux
    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: rsbs-windows
        path: rsbs-windows
    - name: Prepare release assets
      run: |
        mv rsbs-linux/rsbs.appimage "redshipblueship-${RELEASE_TAG}-linux.AppImage"
        # build-windows uploads the unzipped cpack output (artifacts are stored
        # extracted so PR testers get a browsable tree); re-zip it for release.
        (cd rsbs-windows && zip -qr "../redshipblueship-${RELEASE_TAG}-windows.zip" .)
    - name: Render release notes
      run: sed "s/{{TAG}}/${RELEASE_TAG}/g" .github/release-notes-template.md > release-notes.md
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ASSETS=(
          "redshipblueship-${RELEASE_TAG}-linux.AppImage"
          "redshipblueship-${RELEASE_TAG}-windows.zip"
        )
        # Idempotent on re-runs: if the release already exists, refresh its assets.
        if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
          gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
        else
          # --target creates the tag at this run's commit when the tag doesn't
          # exist yet (workflow_dispatch); it is ignored for existing tags.
          gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "RedShipBlueShip ${RELEASE_TAG} (pre-alpha)" \
            --notes-file release-notes.md \
            --prerelease
        fi
    # The branch was only a trigger vehicle; the tag now records the release
    # commit, so drop the branch to keep the ref namespace tidy.
    - name: Delete release trigger branch
      if: startsWith(github.ref, 'refs/heads/release/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/${GITHUB_REF}"
