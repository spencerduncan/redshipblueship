name: python-tests

# Unfiltered on purpose (#379): tools/tests/test_repo_invariants.py asserts on
# files outside tools/ (.claude/tools/, the properties.h.in templates,
# src/common/mm_stubs.c, games/mm/CMakeLists.txt), and a paths filter would let
# exactly the regressions it locks slip through unrun. The suite is hermetic and
# finishes in seconds, so gating every PR on it is cheaper than keeping a paths
# list in sync with what the tests read.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tools/tests/ -v --tb=short
